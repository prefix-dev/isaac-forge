[workspace]
name = "isaac-forge"
description = "Isaac ROS 5.0 packaged on top of the RoboStack conda ecosystem"
channels = ["conda-forge"]
# Build tools are available on both workstation x86_64 and native Jetson ARM64.
# The CUDA/proprietary parts should be built natively on the target architecture.
platforms = ["linux-64", "linux-aarch64"]

# ---------------------------------------------------------------------------
# Development / build environment.
#
# This workspace builds the packages; it is not the runtime environment (see examples/
# for that). rattler-build builds the NVIDIA packages in `recipes/foundation/`, then the
# Isaac ROS packages in `recipes/ros/` from source against the distro's RoboStack.
# ---------------------------------------------------------------------------

[dependencies]
rattler-build = ">=0.76.1"
python = ">=3.12"
git = "*"
git-lfs = "*"
libarchive = "*"   # bsdtar, reads .deb directly

# -m variants.yaml pins cuda_compiler/cuda_compiler_version. rattler-build only
# auto-discovers a variants.yaml next to a recipe, not a shared one, so it has to be
# passed explicitly. Leaving it off does not silently pick a different CUDA -- it fails
# to resolve `cuda_linux-64`, which is the intended loud failure. See variants.yaml.
# The two halves of a full rebuild. `build` skips every package test and `test` runs them
# afterwards, because a package's tests resolve its own run dependencies and early in a
# from-scratch build those siblings are not in output/ yet. See the scripts for the rest.
#
# Both build ROS 2 Lyrical; Jazzy stays on the Isaac ROS 4.6 builds (see README).
[tasks.build]
description = "Build every recipe into ./output (resumable; add --fresh to start over)"
cmd = "./scripts/build_all.sh"

[tasks.test]
description = "Run every built package's own tests against the finished channel"
cmd = "./scripts/test_all.sh"

[tasks.prune]
description = "Drop build trees and source caches from ./output, keeping the packages"
cmd = "rm -rf output/bld output/src_cache output/.tmp && du -sh output"

[tasks.vpi]
description = "Build just the VPI package"
cmd = "./scripts/build_all.sh --recipe vpi"

[tasks.render]
description = "Render every recipe for every distro and platform and check the result (no build)"
cmd = "python scripts/test_variants.py"

[tasks.inventory]
description = "Regenerate packages.json from the cloned sources in src/"
cmd = "python scripts/inventory.py"
