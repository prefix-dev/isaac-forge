# ROS 2 Jazzy, published to https://prefix.dev/isaac-forge/jazzy.
#
# Pass after variants.yaml for recipes/ros, with robostack-jazzy as the ROS channel:
#   -m variants.yaml -m variants-jazzy.yaml
#
#   ros_distro   Fills in ros-${{ ros_distro }}-* in every recipes/ros package name and
#                dependency, and selects the distro-specific dependencies and patches.
#
#   python       robostack-jazzy is built for CPython 3.12 only -- every ros-jazzy-*
#                package carrying python is tagged py312. The C++ recipes get 3.12 for
#                free, because rclpy and the rosidl python generators constrain it. The
#                ament_python recipes do not: their host env is python + pip + setuptools,
#                so python floats to whatever conda-forge ships today (3.14), and the
#                resulting package cannot be installed next to any ROS python package at
#                all. Pin it here rather than in each recipe.
ros_distro:
  - jazzy
python:
  - "3.12.* *_cpython"
