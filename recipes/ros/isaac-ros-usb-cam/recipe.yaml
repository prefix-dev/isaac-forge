schema_version: 1

# ros-${{ ros_distro }}-isaac-ros-usb-cam, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_examples/isaac_ros_usb_cam
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-${{ ros_distro }}-isaac-ros-usb-cam
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_examples/archive/refs/tags/v5.0-0.tar.gz
    sha256: 69220ac65fe2bf6060e14799c129c802d8787e52460179dab60dfbc1c713f7c2
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_usb_cam
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - ros2-distro-mutex
  run:
    - python
    - ros-${{ ros_distro }}-isaac-ros-common
    - ros-${{ ros_distro }}-usb-cam

tests:
  - package_contents:
      files:
        - share/isaac_ros_usb_cam/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_usb_cam
  - python:
      imports:
        - isaac_ros_usb_cam
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_examples
  summary: "Isaac ROS Launch Fragment for USB cameras"
  license: Apache-2.0
