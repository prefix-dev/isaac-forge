schema_version: 1

# ros-${{ ros_distro }}-isaac-ros-cumotion-examples, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_cumotion/isaac_ros_cumotion_examples
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-${{ ros_distro }}-isaac-ros-cumotion-examples
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cumotion/archive/refs/tags/v5.0-0.tar.gz
    sha256: 8a5d685a0227bf545c8e07dcf248f19855ec163d82d6c92612859ef510d65d1e
    target_directory: src

build:
  number: 0
  skip:
    # needs moveit2_tutorials, not in robostack-lyrical yet
    - ros_distro == "lyrical"
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_cumotion_examples
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - ros2-distro-mutex
  run:
    - python
    - ros-${{ ros_distro }}-isaac-ros-common
    - ros-${{ ros_distro }}-isaac-ros-cumotion
    - ros-${{ ros_distro }}-isaac-ros-cumotion-moveit
    - ros-${{ ros_distro }}-isaac-ros-cumotion-robot-description
    - ros-${{ ros_distro }}-moveit-resources-panda-description
    - ros-${{ ros_distro }}-moveit-resources-panda-moveit-config
    - ros-${{ ros_distro }}-moveit2-tutorials
    - ros-${{ ros_distro }}-rclcpp-components
    - ros-${{ ros_distro }}-ros2launch
    - ros-${{ ros_distro }}-rviz2
    - ros-${{ ros_distro }}-ur-moveit-config
    - ros-${{ ros_distro }}-ur-robot-driver

tests:
  - package_contents:
      files:
        - share/isaac_ros_cumotion_examples/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_cumotion_examples

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cumotion
  summary: "Examples demonstrating Isaac ROS cuMotion with MoveIt"
  license: Apache-2.0
