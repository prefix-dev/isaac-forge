schema_version: 1

# ros-${{ ros_distro }}-isaac-ros-mega-controller, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_cloud_control/isaac_ros_mega_controller
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-${{ ros_distro }}-isaac-ros-mega-controller
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cloud_control/archive/refs/tags/v5.0-0.tar.gz
    sha256: f45fe5425833424a5ee7b3a8ec027d17c397d9ee339ce43ba7fc58e48aa59176
    target_directory: src

build:
  number: 1
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_mega_controller
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
    - mkdir -p "${PREFIX}/lib/isaac_ros_mega_controller"
    - ln -sf "../../bin/isaac_ros_mega_controller" "${PREFIX}/lib/isaac_ros_mega_controller/isaac_ros_mega_controller"

requirements:
  host:
    - python
    - pip
    - setuptools
    - ros2-distro-mutex
  run:
    - python
    - ros-${{ ros_distro }}-geometry-msgs
    - ros-${{ ros_distro }}-lifecycle-msgs
    - ros-${{ ros_distro }}-nav2-msgs
    - ros-${{ ros_distro }}-std-msgs
    - ros-${{ ros_distro }}-action-msgs
    - boto3
    - ros-${{ ros_distro }}-rclpy

tests:
  - package_contents:
      files:
        - share/isaac_ros_mega_controller/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_mega_controller
        - lib/isaac_ros_mega_controller/isaac_ros_mega_controller
  - python:
      imports:
        - isaac_ros_mega_controller
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cloud_control
  summary: "MEGA Controller"
  license: Apache-2.0
