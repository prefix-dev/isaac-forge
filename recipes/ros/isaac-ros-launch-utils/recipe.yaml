schema_version: 1

# ros-${{ ros_distro }}-isaac-ros-launch-utils, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_common/isaac_ros_launch_utils
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-${{ ros_distro }}-isaac-ros-launch-utils
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common/archive/refs/tags/v5.0-0.tar.gz
    sha256: 1878a57b9e9aa44c3d4b74e7f7f9b32ecdf461ce20b43ce09ede31518662ab8c
    target_directory: src

build:
  number: 0
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_launch_utils
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - ros2-distro-mutex
    - pyyaml
    - ros-${{ ros_distro }}-ament-index-python
    - ros-${{ ros_distro }}-isaac-ros-common
  run:
    - python
    - ros-${{ ros_distro }}-isaac-ros-common
    - ros-${{ ros_distro }}-ament-index-python
    - ros-${{ ros_distro }}-launch
    - ros-${{ ros_distro }}-launch-ros
    - ros-${{ ros_distro }}-launch-xml
    - pyyaml

tests:
  - package_contents:
      files:
        - share/isaac_ros_launch_utils/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_launch_utils
  - python:
      imports:
        - isaac_ros_launch_utils
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_common
  summary: "Helper functions to simplify ROS2 launch files."
  license: Apache-2.0
