schema_version: 1

# ros-${{ ros_distro }}-isaac-ros-mqtt-bridge, built FROM SOURCE against RoboStack.
#
# Generated by scripts/gen_source.py -- edit the generator, not this file.
# Source: isaac_ros_cloud_control/isaac_ros_mqtt_bridge
# Build type: ament_python (setuptools, installed with pip).

context:
  version: "5.0.0"

package:
  name: ros-${{ ros_distro }}-isaac-ros-mqtt-bridge
  version: ${{ version }}

source:
  - url: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cloud_control/archive/refs/tags/v5.0-0.tar.gz
    sha256: f45fe5425833424a5ee7b3a8ec027d17c397d9ee339ce43ba7fc58e48aa59176
    target_directory: src

build:
  number: 1
  script:
    - export AMENT_PREFIX_PATH="${PREFIX}${AMENT_PREFIX_PATH:+:${AMENT_PREFIX_PATH}}"
    - cd src/isaac_ros_mqtt_bridge
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
    - mkdir -p "${PREFIX}/lib/isaac_ros_mqtt_bridge"
    - ln -sf "../../bin/mqtt_ros_bridge_node" "${PREFIX}/lib/isaac_ros_mqtt_bridge/mqtt_ros_bridge_node"

requirements:
  host:
    - python
    - pip
    - setuptools
    - pyyaml
    - ros-${{ ros_distro }}-ament-index-python
    - ros-${{ ros_distro }}-isaac-ros-common
  run:
    - python
    - paho-mqtt
    - ros-${{ ros_distro }}-isaac-ros-common
    - ros-${{ ros_distro }}-rosbridge-library
    - ros-${{ ros_distro }}-vda5050-msgs
    - ros-${{ ros_distro }}-rclpy
    - ros-${{ ros_distro }}-std-msgs

tests:
  - package_contents:
      files:
        - share/isaac_ros_mqtt_bridge/package.xml
        - share/ament_index/resource_index/packages/isaac_ros_mqtt_bridge
        - lib/isaac_ros_mqtt_bridge/mqtt_ros_bridge_node
  - python:
      imports:
        - isaac_ros_mqtt_bridge
      pip_check: false

about:
  homepage: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_cloud_control
  summary: "MQTT Bridge"
  license: Apache-2.0
