name: release

# Builds every recipe for x86_64 and ARM64, tests the packages natively on GitHub-hosted
# runners, and publishes them to https://prefix.dev/channels/isaac-forge/jazzy and
# https://prefix.dev/channels/isaac-forge/lyrical.
#
#   plan         which recipes this run builds
#   render       every recipe renders for both distros (scripts/test_variants.py)
#   foundations  recipes/foundation, once per platform. These do not depend on the ROS
#                distro, so the same package is uploaded to both channels.
#   ros          recipes/ros, per platform and distro, against that distro's RoboStack.
#
# Pull requests build and test the recipes they change and publish nothing.
#
# The filename matters: the prefix.dev trusted publisher is bound to `release.yml`.
# Renaming this file breaks authentication.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      recipes:
        description: >-
          Optional comma/space-separated recipe directory names to build, test, and publish
          in the given order (for example: libv4l,nvv4l2). Names are looked up in
          recipes/foundation and recipes/ros. Empty builds everything.
        required: false
        type: string

permissions:
  contents: read

env:
  # Hosted runners have no GPU. Let rattler-build solve conda-forge's CUDA PyTorch
  # packages; their import tests do not require a driver.
  CONDA_OVERRIDE_CUDA: "13.3"

# Never run two releases at once, and never cancel one midway through uploading. A newer
# push to the same pull request does replace the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      # "all", "none", or space-separated recipe directory names.
      foundation: ${{ steps.plan.outputs.foundation }}
      ros: ${{ steps.plan.outputs.ros }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SELECTED_RECIPES: ${{ inputs.recipes }}
        run: |
          foundation=all ros=all
          if [ "$EVENT" = pull_request ]; then
            # The recipes this pull request touches. A change elsewhere (variant files,
            # the generator) is covered by the render job rather than a full rebuild.
            mapfile -t changed < <(git diff --name-only "$BASE...$HEAD" |
              sed -nE 's#^recipes/(foundation|ros)/([^/]+)/.*#\1 \2#p' | sort -u)
            foundation="" ros=""
            for entry in "${changed[@]}"; do
              read -r stage name <<< "$entry"
              # Deleted recipes have nothing left to build.
              [ -f "recipes/$stage/$name/recipe.yaml" ] || continue
              if [ "$stage" = foundation ]; then foundation+="$name "; else ros+="$name "; fi
            done
          elif [ -n "${SELECTED_RECIPES//[[:space:],]/}" ]; then
            foundation="" ros=""
            for name in $(printf '%s' "$SELECTED_RECIPES" | tr ',' ' '); do
              if [ -f "recipes/foundation/$name/recipe.yaml" ]; then foundation+="$name "
              elif [ -f "recipes/ros/$name/recipe.yaml" ]; then ros+="$name "
              else echo "::error::No recipe named $name in recipes/foundation or recipes/ros"; exit 2
              fi
            done
          fi
          foundation="${foundation% }" ros="${ros% }"
          echo "foundation=${foundation:-none}" >> "$GITHUB_OUTPUT"
          echo "ros=${ros:-none}" >> "$GITHUB_OUTPUT"
          echo "foundation: ${foundation:-none}"
          echo "ros: ${ros:-none}"

  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        timeout-minutes: 15
        with:
          pixi-version: v0.75.0
          locked: true
      - run: pixi run render

  foundations:
    name: foundations (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.foundation != 'none'
    permissions:
      contents: read
      # Trusted publishing: rattler-build exchanges the GitHub OIDC token with prefix.dev
      # itself, so there is no API key anywhere in this repo. Pull requests never reach
      # the upload step, and pull requests from forks get no OIDC token at all.
      id-token: write
    strategy:
      # One architecture failing must not cancel publishing on the other.
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    env:
      PLATFORM: ${{ matrix.platform }}
      # Reference channel only; see scripts/ci_build.sh.
      DISTRO: jazzy
      # During ARM bootstrap some leaf packages compile before their run closure exists.
      # Quarantine those, but publish everything that passed.
      STRICT: ${{ matrix.platform == 'linux-64' }}
    steps:
      - uses: actions/checkout@v7

      # The GXF, NITROS and VPI host environments are multi-GB each, and VPI alone
      # unpacks to ~1 GB. A default runner does not have room. dotnet + android + ghc
      # are ~25 GB between them, which is enough; the hosted tool cache is deliberately
      # left alone because setup-pixi installs into it.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - uses: prefix-dev/setup-pixi@v0.10.0
        # A hang here should fail fast rather than sit on the job timeout.
        timeout-minutes: 15
        with:
          pixi-version: v0.75.0
          # pixi.lock pins rattler-build, so CI builds with the same version as local.
          locked: true

      - name: Build
        env:
          RECIPES: ${{ needs.plan.outputs.foundation }}
        run: |
          read -r -a recipes <<< "$RECIPES"
          if [ "$RECIPES" = all ]; then recipes=(); fi
          ./scripts/ci_build.sh build foundation "${recipes[@]}"

      - name: Test
        run: ./scripts/ci_build.sh test

      - name: Drop build trees
        if: always()
        run: rm -rf output/bld output/src_cache output/.tmp

      # The ros jobs build against these before they are published, which is what lets a
      # pull request change a foundation and a ROS package together.
      - name: Hand tested packages to the ros jobs
        uses: actions/upload-artifact@v7
        with:
          name: foundation-${{ matrix.platform }}
          path: output/*/*.conda
          if-no-files-found: ignore
          retention-days: 1

      # `--skip-existing all` checked isaac-forge/jazzy, so this sees only new packages.
      # Lyrical first: a package in isaac-forge/jazzy is then always in isaac-forge/lyrical,
      # and a run that fails between the two uploads rebuilds and retries both.
      - name: Publish to isaac-forge/lyrical and isaac-forge/jazzy
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          pkgs=(output/*/*.conda)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No new packages -- everything already exists in the channels."
            exit 0
          fi
          printf 'Publishing %s package(s):\n' "${#pkgs[@]}"
          printf '  %s\n' "${pkgs[@]}"
          for channel in isaac-forge/lyrical isaac-forge/jazzy; do
            pixi run rattler-build upload prefix --skip-existing -c "$channel" "${pkgs[@]}"
          done

      # Publish what passed before reporting failures, so retries stay incremental.
      - name: Report build or test failures
        if: always()
        run: |
          if [ -e failed-packages/build-failed ] || [ -e failed-packages/test-failed ]; then
            echo "::error::One or more recipes failed; successful packages were still published."
            exit 1
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rattler-build-log-foundation-${{ matrix.platform }}
          path: |
            output/rattler-build-log.txt
            failed-packages/packages.txt
          if-no-files-found: ignore
          retention-days: 14

  ros:
    name: ros (${{ matrix.distro }}, ${{ matrix.platform }})
    needs: [plan, foundations]
    # Also when foundations had nothing to build (skipped) or partly failed: the published
    # foundations are still there to build against.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ros != 'none' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
        platform: [linux-64, linux-aarch64]
        include:
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - distro: jazzy
            strict: true
          # Lyrical is still being brought up: its failures are warnings, so they neither
          # turn main red nor hide a Jazzy failure. Set to true once it reaches parity.
          - distro: lyrical
            strict: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    env:
      PLATFORM: ${{ matrix.platform }}
      DISTRO: ${{ matrix.distro }}
      # ARM64 quarantines failures as warnings, as in the foundations job.
      STRICT: ${{ matrix.strict && matrix.platform == 'linux-64' }}
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - uses: prefix-dev/setup-pixi@v0.10.0
        timeout-minutes: 15
        with:
          pixi-version: v0.75.0
          locked: true

      # Absent when the foundations job built nothing new, which is the normal case.
      - name: Fetch foundations built in this run
        if: needs.foundations.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: foundation-${{ matrix.platform }}
          path: output

      # Built against, but published by the foundations job.
      - name: Mark fetched foundations as inputs
        run: |
          mkdir -p output
          find output -name '*.conda' -printf '%f\n' > output/.inputs
          echo "$(wc -l < output/.inputs) foundation package(s) from this run"

      - name: Build
        env:
          RECIPES: ${{ needs.plan.outputs.ros }}
        run: |
          read -r -a recipes <<< "$RECIPES"
          if [ "$RECIPES" = all ]; then recipes=(); fi
          ./scripts/ci_build.sh build ros "${recipes[@]}"

      - name: Test
        run: ./scripts/ci_build.sh test

      - name: Drop build trees
        if: always()
        run: rm -rf output/bld output/src_cache output/.tmp

      - name: Publish to isaac-forge/${{ matrix.distro }}
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          pkgs=()
          for p in output/*/*.conda; do
            grep -qxF "$(basename "$p")" output/.inputs || pkgs+=("$p")
          done
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No new packages -- everything already exists in the channel."
            exit 0
          fi
          printf 'Publishing %s package(s):\n' "${#pkgs[@]}"
          printf '  %s\n' "${pkgs[@]}"
          pixi run rattler-build upload prefix -c "isaac-forge/$DISTRO" "${pkgs[@]}"

      - name: Report build or test failures
        if: always()
        run: |
          if [ -e failed-packages/build-failed ] || [ -e failed-packages/test-failed ]; then
            echo "::error::One or more recipes failed; successful packages were still published."
            exit 1
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rattler-build-log-${{ matrix.distro }}-${{ matrix.platform }}
          path: |
            output/rattler-build-log.txt
            failed-packages/packages.txt
          if-no-files-found: ignore
          retention-days: 14
