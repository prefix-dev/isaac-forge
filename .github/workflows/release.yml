name: release

# Builds every recipe for x86_64 and ARM64, tests the packages natively on GitHub-hosted
# runners, and publishes them to https://prefix.dev/channels/isaac-forge/lyrical.
#
#   plan            which recipes this run builds
#   render          every recipe renders for every distro (scripts/test_variants.py)
#   build           per platform and ROS distro: recipes/foundation, then recipes/ros
#                   against that distro's RoboStack, then tests, then publish
#   jazzy-snapshot  manual only: copies the frozen Isaac ROS 4.6 Jazzy release from the
#                   old isaac-forge channel to isaac-forge/jazzy (scripts/snapshot_jazzy.py)
#
# Pull requests build and test the recipes they change and publish nothing.
#
# The filename matters: the prefix.dev trusted publisher is bound to `release.yml`.
# Renaming this file breaks authentication.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      recipes:
        description: >-
          Optional comma/space-separated recipe directory names to build, test, and publish
          in the given order (for example: libv4l,nvv4l2). Names are looked up in
          recipes/foundation and recipes/ros. Empty builds everything.
        required: false
        type: string
      jazzy_snapshot:
        description: >-
          Copy the Isaac ROS 4.6 Jazzy release to isaac-forge/jazzy instead of building.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Hosted runners have no GPU. Let rattler-build solve conda-forge's CUDA PyTorch
  # packages; their import tests do not require a driver.
  CONDA_OVERRIDE_CUDA: "13.3"

# Never run two releases at once, and never cancel one midway through uploading. A newer
# push to the same pull request does replace the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: ${{ !inputs.jazzy_snapshot }}
    runs-on: ubuntu-24.04
    outputs:
      # "all", "none", or space-separated recipe directory names.
      foundation: ${{ steps.plan.outputs.foundation }}
      ros: ${{ steps.plan.outputs.ros }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SELECTED_RECIPES: ${{ inputs.recipes }}
        run: |
          foundation=all ros=all
          if [ "$EVENT" = pull_request ]; then
            # The recipes this pull request touches. A change elsewhere (variant files,
            # the generator) is covered by the render job rather than a full rebuild.
            mapfile -t changed < <(git diff --name-only "$BASE...$HEAD" |
              sed -nE 's#^recipes/(foundation|ros)/([^/]+)/.*#\1 \2#p' | sort -u)
            foundation="" ros=""
            for entry in "${changed[@]}"; do
              read -r stage name <<< "$entry"
              # Deleted recipes have nothing left to build.
              [ -f "recipes/$stage/$name/recipe.yaml" ] || continue
              if [ "$stage" = foundation ]; then foundation+="$name "; else ros+="$name "; fi
            done
          elif [ -n "${SELECTED_RECIPES//[[:space:],]/}" ]; then
            foundation="" ros=""
            for name in $(printf '%s' "$SELECTED_RECIPES" | tr ',' ' '); do
              if [ -f "recipes/foundation/$name/recipe.yaml" ]; then foundation+="$name "
              elif [ -f "recipes/ros/$name/recipe.yaml" ]; then ros+="$name "
              else echo "::error::No recipe named $name in recipes/foundation or recipes/ros"; exit 2
              fi
            done
          fi
          foundation="${foundation% }" ros="${ros% }"
          echo "foundation=${foundation:-none}" >> "$GITHUB_OUTPUT"
          echo "ros=${ros:-none}" >> "$GITHUB_OUTPUT"
          echo "foundation: ${foundation:-none}"
          echo "ros: ${ros:-none}"

  render:
    if: ${{ !inputs.jazzy_snapshot }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        timeout-minutes: 15
        with:
          pixi-version: v0.81.0
          locked: true
      - run: pixi run render

  build:
    name: build (${{ matrix.distro }}, ${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.foundation != 'none' || needs.plan.outputs.ros != 'none'
    permissions:
      contents: read
      # Trusted publishing: rattler-build exchanges the GitHub OIDC token with prefix.dev
      # itself, so there is no API key anywhere in this repo. Pull requests never reach
      # the upload step, and pull requests from forks get no OIDC token at all.
      id-token: write
    strategy:
      # One job failing must not cancel publishing in the others.
      fail-fast: false
      matrix:
        # Another distro: a variants-<distro>.yaml, an isaac-forge/<distro> channel with
        # this trusted publisher, and an entry here.
        distro: [lyrical]
        platform: [linux-64, linux-aarch64]
        include:
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          # Lyrical is still being brought up: its failures are warnings, so main stays
          # green while it catches up. Set to true once it reaches parity.
          - distro: lyrical
            strict: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 720
    env:
      PLATFORM: ${{ matrix.platform }}
      DISTRO: ${{ matrix.distro }}
      # ARM64 quarantines test failures as warnings: during bootstrap some leaf packages
      # compile before their run closure exists.
      STRICT: ${{ matrix.strict && matrix.platform == 'linux-64' }}
    steps:
      - uses: actions/checkout@v7

      # The GXF, NITROS and VPI host environments are multi-GB each, and VPI alone
      # unpacks to ~1 GB. A default runner does not have room. dotnet + android + ghc
      # are ~25 GB between them, which is enough; the hosted tool cache is deliberately
      # left alone because setup-pixi installs into it.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - uses: prefix-dev/setup-pixi@v0.10.2
        # A hang here should fail fast rather than sit on the job timeout.
        timeout-minutes: 15
        with:
          pixi-version: v0.81.0
          # pixi.lock pins rattler-build, so CI builds with the same version as local.
          locked: true

      - name: Build foundations
        if: needs.plan.outputs.foundation != 'none'
        env:
          RECIPES: ${{ needs.plan.outputs.foundation }}
        run: |
          read -r -a recipes <<< "$RECIPES"
          if [ "$RECIPES" = all ]; then recipes=(); fi
          ./scripts/ci_build.sh build foundation "${recipes[@]}"

      - name: Build ROS packages
        if: needs.plan.outputs.ros != 'none'
        env:
          RECIPES: ${{ needs.plan.outputs.ros }}
        run: |
          read -r -a recipes <<< "$RECIPES"
          if [ "$RECIPES" = all ]; then recipes=(); fi
          ./scripts/ci_build.sh build ros "${recipes[@]}"

      # After everything is built, because a test environment needs the package's whole
      # run closure; see scripts/ci_build.sh.
      - name: Test
        run: ./scripts/ci_build.sh test

      - name: Drop build trees
        if: always()
        run: rm -rf output/bld output/src_cache output/.tmp

      # `--skip-existing all` keeps already-published files out of ./output, so this sees
      # only new packages.
      - name: Publish to isaac-forge/${{ matrix.distro }}
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          pkgs=(output/*/*.conda)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "No new packages -- everything already exists in the channel."
            exit 0
          fi
          printf 'Publishing %s package(s):\n' "${#pkgs[@]}"
          printf '  %s\n' "${pkgs[@]}"
          pixi run rattler-build upload prefix -c "isaac-forge/$DISTRO" "${pkgs[@]}"

      # Publish what passed before reporting failures, so retries stay incremental.
      - name: Report build or test failures
        if: always()
        run: |
          if [ -e failed-packages/build-failed ] || [ -e failed-packages/test-failed ]; then
            echo "::error::One or more recipes failed; successful packages were still published."
            exit 1
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rattler-build-log-${{ matrix.distro }}-${{ matrix.platform }}
          path: |
            output/rattler-build-log.txt
            failed-packages/packages.txt
          if-no-files-found: ignore
          retention-days: 14

  jazzy-snapshot:
    if: ${{ inputs.jazzy_snapshot }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - uses: prefix-dev/setup-pixi@v0.10.2
        timeout-minutes: 15
        with:
          pixi-version: v0.81.0
          locked: true

      # The solve and its result are in the log; a 4.6 package that no longer installs is
      # listed as "left out" rather than copied.
      - name: Select and download the 4.6 release
        run: pixi exec --spec "py-rattler>=0.27" python scripts/snapshot_jazzy.py --download snapshot

      # --skip-existing makes a re-run only add what is missing.
      - name: Publish to isaac-forge/jazzy
        run: |
          shopt -s nullglob
          pkgs=(snapshot/*/*.conda)
          printf 'Publishing %s package(s)\n' "${#pkgs[@]}"
          pixi run rattler-build upload prefix --skip-existing -c isaac-forge/jazzy "${pkgs[@]}"
