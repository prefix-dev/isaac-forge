[workspace]
name = "isaac-forge-yolov8"
description = "Isaac ROS YOLOv8 inference with packages from prefix.dev/isaac-forge"
channels = ["conda-forge"]
# The Isaac Forge binaries target Ubuntu 24.04's glibc floor.
platforms = [
  { platform = "linux-64", glibc = "2.38" },
  # JetPack 7 on Orin: CUDA 13 driver, SM87 GPU.
  { platform = "linux-aarch64", glibc = "2.38", cuda = { driver = "13", arch = "8.7" } },
]

[dependencies]
numpy = "*"
py-opencv = ">=4.13,<5"
pillow = "*"
rerun-sdk = ">=0.38,<0.39"

# Default: ROS 2 Lyrical with Isaac ROS 5.0.
[feature.lyrical]
channels = [
  { channel = "https://prefix.dev/isaac-forge/lyrical", priority = 2 },
  { channel = "https://prefix.dev/robostack-lyrical", priority = 1 },
]

[feature.lyrical.dependencies]
python = "3.14.*"
ros-lyrical-ros-base = "*"
ros-lyrical-rclcpp-components = "*"
ros-lyrical-vision-msgs = "*"
# Image -> CUDA tensor -> TensorRT -> YOLOv8 decoder -> Detection2DArray.
# image_proc supplies the GPU resize/format conversion used by the Jetson launch path.
ros-lyrical-isaac-ros-image-proc = "5.0.*"
ros-lyrical-isaac-ros-dnn-image-encoder = "5.0.*"
ros-lyrical-isaac-ros-tensor-rt = "5.0.*"
ros-lyrical-isaac-ros-yolov8 = "5.0.*"

# `pixi run -e jazzy ...`: ROS 2 Jazzy with Isaac ROS 4.6, NVIDIA's last Jazzy release.
[feature.jazzy]
channels = [
  { channel = "https://prefix.dev/isaac-forge", priority = 2 },
  { channel = "https://prefix.dev/robostack-jazzy", priority = 1 },
]

[feature.jazzy.dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-vision-msgs = "*"
ros-jazzy-isaac-ros-image-proc = "4.6.*"
ros-jazzy-isaac-ros-dnn-image-encoder = "4.6.*"
ros-jazzy-isaac-ros-tensor-rt = "4.6.*"
ros-jazzy-isaac-ros-yolov8 = "4.6.*"

[environments]
default = ["lyrical"]
jazzy = ["jazzy"]

[tasks.check]
description = "Show that Pixi resolved the Isaac ROS packages from isaac-forge"
cmd = "ros2 pkg prefix isaac_ros_yolov8 && ros2 pkg prefix isaac_ros_tensor_rt && ros2 component types | grep -E 'TensorRTNode|YoloV8DecoderNode'"

[tasks.demo]
description = "Run real YOLOv8n inference on a sample image and visualize it in Rerun"
cmd = "python yolo_demo.py"

[tasks.video]
description = "Stream a webcam or video through YOLOv8 and visualize it live in Rerun"
cmd = "python yolo_video.py"
